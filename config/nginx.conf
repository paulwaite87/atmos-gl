worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;

    # UI server. The server block lives here (not in conf.d) so this single mounted
    # file fully defines behaviour; the stock conf.d/default.conf is intentionally NOT
    # included to avoid a duplicate server.
    server {
        listen       8080;
        server_name  localhost;
        root         /usr/share/nginx/html;
        index        index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Reverse-proxy map_api behind this same origin, so the browser only ever talks
        # to one host:port -- the frontend's API/data/config requests are same-origin,
        # and a future session cookie needs no cross-site cookie handling. map_api is
        # the Compose service name, resolved via Docker's embedded DNS on the agl network.
        #
        # proxy_pass targets a variable (not a bare hostname) so nginx resolves it at
        # REQUEST time via the `resolver` below, instead of once at startup -- with a
        # bare hostname, nginx refuses to start at all if map_api's container isn't
        # already up on the network yet (confirmed: docker-compose has no depends_on
        # ordering map_ui after map_api). Variable form degrades to a 502 per-request
        # until map_api comes up, rather than crash-looping the whole map_ui container.
        resolver 127.0.0.11 valid=10s;
        set $map_api_upstream map_api:9000;

        location /api/ {
            proxy_pass http://$map_api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /data/ {
            proxy_pass http://$map_api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /config {
            proxy_pass http://$map_api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /me/settings {
            proxy_pass http://$map_api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # JS modules change during development, and ES-module *sub-imports*
        # (e.g. waves.js -> ./_windparticles_gl.js) bypass index.html's ?t= cache-bust.
        # "no-cache" = the browser must revalidate every load: nginx returns 304 when
        # the file is unchanged (cheap) and 200 with fresh bytes when it changed, so a
        # stale module can never be pinned again. Keep an ETag for the 304s.
        location ~* \.js$ {
            add_header Cache-Control "no-cache";
            etag on;
        }
    }
}